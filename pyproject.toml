[project]
name = "offline"
version = "0.1.0"
description = "Bootstrap script for offline development environment setup"
authors = [{ name = "offline contributors" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
offline = "offline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offline"]
